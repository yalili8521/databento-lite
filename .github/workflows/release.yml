name: Release to npm

# Publishes when a tag like v0.1.0 is pushed. The tag must match package.json's version.
# Needs an NPM_TOKEN repository secret (an npm "Automation" token) with publish rights.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "package.json is $PKG but tag is $TAG"; exit 1; fi
      - run: npm run check
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
